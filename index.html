<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PhD Research Command Center Pro v3.0</title>
  
  <!-- FontAwesome, KaTeX & html2pdf -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-hover: #1b222d;
      --surface-border: #263140;
      --primary: #58a6ff;
      --primary-hover: #1f6feb;
      --accent-green: #2ea043;
      --accent-yellow: #d29922;
      --accent-blue: #388bfd;
      --accent-danger: #f85149;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --font-mono: "SF Mono", Monaco, Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      display: flex;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* BARA LATERALĂ */
    aside {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      padding: 1.2rem 1.1rem;
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 { font-size: 1.05rem; color: var(--text-bright); font-weight: 700; letter-spacing: -0.3px; }
    .brand span { font-size: 0.68rem; background: var(--primary-hover); color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 600; }

    nav { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      width: 100%;
    }
    .nav-btn i { width: 18px; color: var(--text-muted); text-align: center; font-size: 0.95rem; }
    .nav-btn:hover { background: var(--surface-hover); color: var(--text-bright); }
    .nav-btn.active { background: rgba(88, 166, 255, 0.12); color: var(--primary); border-color: rgba(88, 166, 255, 0.35); font-weight: 600; }
    .nav-btn.active i { color: var(--primary); }

    .sidebar-footer {
      padding: 0.85rem;
      border-top: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ZONA PRINCIPALĂ */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }

    header {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      flex-shrink: 0;
    }
    .header-title { font-size: 1.05rem; font-weight: 600; color: var(--text-bright); }
    .header-actions { display: flex; align-items: center; gap: 10px; }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
    }

    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

    /* CARDURI ȘI BUTOANE */
    button, input, select, textarea { font-family: inherit; color: inherit; }
    .btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-bright);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s;
    }
    .btn:hover { background: var(--surface-hover); border-color: var(--primary); }
    .btn-sm { padding: 5px 8px; font-size: 0.78rem; }
    .btn-primary { background: var(--primary); color: #0b0f14; border-color: var(--primary); font-weight: 600; }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }
    .btn-success { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
    .btn-danger { background: rgba(248, 81, 73, 0.15); color: var(--accent-danger); border-color: rgba(248, 81, 73, 0.4); }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 1.15rem;
      margin-bottom: 1.15rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--surface-border);
    }
    .card-title { font-size: 0.95rem; font-weight: 600; color: var(--text-bright); display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 0.85rem; }
    .form-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text-bright);
      font-size: 0.88rem;
    }
    .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2); }

    /* BRIEF COORDONATOR - THEMED BORDERS & BADGES */
    .brief-card-green { border-left: 4px solid var(--accent-green); }
    .brief-card-yellow { border-left: 4px solid var(--accent-yellow); }
    .brief-card-blue { border-left: 4px solid var(--accent-blue); }

    /* POMODORO NEON ANIMATED RING */
    .pomodoro-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }
    .timer-ring-container {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1rem 0;
    }
    .timer-ring-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .timer-ring-bg {
      fill: none;
      stroke: rgba(255,255,255,0.06);
      stroke-width: 8;
    }
    .timer-ring-bar {
      fill: none;
      stroke: var(--primary);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 691;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
      filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.4));
    }
    .timer-text-content {
      position: absolute;
      text-align: center;
    }
    .timer-display-animated {
      font-size: 3.2rem;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--text-bright);
      letter-spacing: -1px;
    }
    .timer-phase-badge {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      font-weight: 700;
    }

    /* LATEX CHEAT SHEET */
    .latex-cheat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .latex-chip {
      background: var(--bg);
      border: 1px solid var(--surface-border);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.15s;
    }
    .latex-chip:hover { border-color: var(--primary); background: rgba(88,166,255,0.08); transform: translateY(-1px); }
    .latex-chip span.math-lbl { font-family: var(--font-mono); color: var(--primary); font-size: 0.72rem; }

    /* CALENDAR GRID */
    .calendar-container {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .calendar-header-day {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 4px 0;
    }
    .calendar-cell {
      background: var(--bg);
      border: 1px solid var(--surface-border);
      min-height: 85px;
      border-radius: 6px;
      padding: 6px;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .calendar-cell.today { border-color: var(--primary); background: rgba(88,166,255,0.05); }
    .calendar-cell .day-num { font-weight: 700; color: var(--text-muted); }
    .calendar-cell.today .day-num { color: var(--primary); }
    .cal-event-pill {
      font-size: 0.68rem;
      padding: 2px 4px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .cal-event-pill.deadline { background: rgba(248,81,73,0.25); color: #ff7b72; }
    .cal-event-pill.conf { background: rgba(56,139,253,0.25); color: #79c0ff; }
    .cal-event-pill.milestone { background: rgba(46,160,67,0.25); color: #7ee787; }

    /* TABELE & ALTELE */
    .table-responsive { overflow-x: auto; border: 1px solid var(--surface-border); border-radius: 6px; }
    table.data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.82rem; }
    table.data-table th { background: rgba(255,255,255,0.03); color: var(--text-muted); padding: 8px 12px; border-bottom: 1px solid var(--surface-border); }
    table.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--surface-border); vertical-align: top; }
    table.data-table tr:hover td { background: rgba(255,255,255,0.02); }
    .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.72rem; background: rgba(88, 166, 255, 0.15); color: var(--primary); margin: 2px; }

    #canvas-container {
      position: relative;
      width: 100%;
      height: 520px;
      background: #0f141c;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      overflow: hidden;
      touch-action: none;
    }
    #sketch-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
    .canvas-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
      background: var(--surface);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
    }
    .canvas-toolbar .btn.active { background: var(--primary); color: #000; font-weight: 600; }

    .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media (max-width: 900px) { .split-grid { grid-template-columns: 1fr; } aside { width: 210px; } }
    
    .math-preview {
      background: #0b0f14;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 1.5rem;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <aside>
    <div class="brand">
      <i class="fa-solid fa-graduation-cap" style="color: var(--primary); font-size: 1.3rem;"></i>
      <div>
        <h1>PhD Workspace</h1>
        <span>v3.0 Pro</span>
      </div>
    </div>

    <nav>
      <button class="nav-btn active" onclick="switchTab('lit-matrix')">
        <i class="fa-solid fa-book-bookmark"></i> Matrice Literatură
      </button>
      <button class="nav-btn" onclick="switchTab('meeting-brief')">
        <i class="fa-solid fa-user-tie"></i> Brief Coordonator
      </button>
      <button class="nav-btn" onclick="switchTab('math-tools')">
        <i class="fa-solid fa-square-root-variable"></i> Math & LaTeX Gen
      </button>
      <button class="nav-btn" onclick="switchTab('deep-work')">
        <i class="fa-solid fa-stopwatch"></i> Focus & Pomodoro
      </button>
      <button class="nav-btn" onclick="switchTab('calendar-view')">
        <i class="fa-solid fa-calendar-days"></i> Calendar & Termene
      </button>
      <button class="nav-btn" onclick="switchTab('qos-calc')">
        <i class="fa-solid fa-calculator"></i> QoS & Network Calc
      </button>
      <button class="nav-btn" onclick="switchTab('stylus-canvas')">
        <i class="fa-solid fa-pen-ruler"></i> Stylus / Diagrame
      </button>
      <button class="nav-btn" onclick="switchTab('exp-bench')">
        <i class="fa-solid fa-flask-vial"></i> Benchmark & Log
      </button>
      <button class="nav-btn" onclick="switchTab('state-log')">
        <i class="fa-solid fa-location-arrow"></i> Where I Left Off
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-sm" style="width: 100%; font-size: 0.75rem;" onclick="exportFullBackup()">
        <i class="fa-solid fa-download"></i> Export Sync (JSON)
      </button>
      <label class="btn btn-sm" style="width: 100%; font-size: 0.75rem; justify-content: center; cursor: pointer;">
        <i class="fa-solid fa-upload"></i> Import Sync
        <input type="file" id="importJsonInput" style="display:none" onchange="importFullBackup(event)">
      </label>
    </div>
  </aside>

  <main>
    <header>
      <div class="header-title" id="page-title">Matrice Analiză Literatură</div>
      <div class="header-actions">
        <button class="btn btn-danger btn-sm" onclick="switchTab('state-log')">
          <i class="fa-solid fa-flag"></i> Salvează Stare
        </button>
      </div>
    </header>

    <div class="content-area">

      <!-- 1. MATRICE LITERATURA -->
      <section id="lit-matrix" class="view-section active">
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i class="fa-solid fa-plus-circle"></i> Înregistrare Articol</div>
            <div>
              <button class="btn btn-sm" onclick="toggleBibtexImport()"><i class="fa-solid fa-file-import"></i> Import BibTeX Masiv</button>
            </div>
          </div>
          
          <div id="bibtex-import-box" style="display: none; margin-bottom: 1rem; padding: 10px; background: rgba(255,255,255,0.02); border: 1px dashed var(--surface-border); border-radius: 6px;">
            <label class="form-label">Lipește textul BibTeX:</label>
            <textarea id="bibtex-bulk-input" class="form-control" rows="4" placeholder="@article{ref2026,\n  title={Real-Time Middleware},\n  author={Smith, J.},\n  year={2026}\n}"></textarea>
            <button class="btn btn-primary btn-sm" style="margin-top: 6px;" onclick="parseBulkBibtex()"><i class="fa-solid fa-bolt"></i> Procesează și Adaugă</button>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
            <div class="form-group">
              <label class="form-label">Titlu Articol</label>
              <input type="text" id="paper-title" class="form-control" placeholder="ex. Real-Time Teleoperation over Zenoh...">
            </div>
            <div class="form-group">
              <label class="form-label">Autori & An</label>
              <input type="text" id="paper-authors" class="form-control" placeholder="ex. Smith et al., 2026">
            </div>
            <div class="form-group">
              <label class="form-label">Metodologie / Arhitectură</label>
              <input type="text" id="paper-method" class="form-control" placeholder="ex. CycloneDDS vs rmw_zenoh">
            </div>
            <div class="form-group">
              <label class="form-label">Tag-uri / Topic</label>
              <input type="text" id="paper-tags" class="form-control" placeholder="ex. #dds #zenoh #latency">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Metrici / Rezultate Cheie & Limitări</label>
            <textarea id="paper-notes" class="form-control" rows="2" placeholder="Latență sub 5ms pe rețele 1Gbps, dar jitter crescut la packet loss >2%..."></textarea>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-primary" onclick="addPaper()"><i class="fa-solid fa-save"></i> Salvează Articol</button>
            <button class="btn" onclick="exportBibtex()"><i class="fa-solid fa-file-code"></i> Export BibTeX</button>
            <button class="btn" onclick="exportCSV()"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">Bază de Date Articole (<span id="paper-count">0</span>)</div>
            <input type="text" id="search-papers" class="form-control" style="width: 250px;" placeholder="Caută articol..." onkeyup="renderPapers()">
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 25%;">Titlu & Autori</th>
                  <th style="width: 20%;">Metodă / Sistem</th>
                  <th style="width: 30%;">Metrici & Concluzii</th>
                  <th style="width: 15%;">Tag-uri</th>
                  <th style="width: 10%;">Acțiuni</th>
                </tr>
              </thead>
              <tbody id="papers-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 2. BRIEF COORDONATOR (CU CELE 3 CULORI & EXPORT PDF) -->
      <section id="meeting-brief" class="view-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h2 style="font-size: 1.1rem; color: var(--text-bright);">Pregătire Sinteză Ședință Îndrumător</h2>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-primary" onclick="generateBriefPDF()"><i class="fa-solid fa-file-pdf"></i> Export Raport PDF (A4)</button>
            <button class="btn btn-success" onclick="copyBriefText()"><i class="fa-solid fa-copy"></i> Copiază Text Formatat</button>
          </div>
        </div>

        <div class="split-grid">
          <!-- Coloana de Editare -->
          <div>
            <!-- Card Verde: Progres -->
            <div class="card brief-card-green">
              <div class="card-header">
                <div class="card-title" style="color: #7ee787;"><i class="fa-solid fa-circle-check"></i> 1. Progres Realizat & Rezultate</div>
              </div>
              <div class="form-group">
                <label class="form-label">Ce s-a finalizat concret de la ultima întâlnire:</label>
                <textarea id="brief-green" class="form-control" rows="4" placeholder="- Configurat Zenoh router pe nodul edge&#10;- Măsurat latența RTT pe 100k pachete&#10;- Redactat secțiunea III.A"></textarea>
              </div>
            </div>

            <!-- Card Galben: Blocaje -->
            <div class="card brief-card-yellow">
              <div class="card-header">
                <div class="card-title" style="color: #e3b341;"><i class="fa-solid fa-triangle-exclamat
